
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b5ffb5"/>
      <stop offset="50%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#008f25"/>
