
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050805">
<title>Регистрация — Failoria ID</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#050805;color:#eaffea;
 font-family:Arial,sans-serif;display:flex;
 align-items:center;justify-content:center;padding:20px
}
.card{
 width:100%;max-width:420px;background:#0b120b;
 border:1px solid #174d20;border-radius:20px;
 padding:30px 25px;box-shadow:0 0 35px #00ff3018
}
.logo{color:#39ff59;letter-spacing:5px;font-size:13px;text-align:center}
.symbol{
 text-align:center;font-size:65px;font-weight:bold;
 color:#39ff59;margin:15px;text-shadow:0 0 25px #39ff5960
}
h1{text-align:center;font-size:27px;margin:10px 0}
.subtitle{text-align:center;color:#91a991;font-size:14px;margin-bottom:25px}
label{display:block;font-size:13px;color:#9cbd9c;margin:15px 0 7px}
input{
 width:100%;padding:14px;background:#101b10;
 border:1px solid #294b29;border-radius:9px;
 color:white;font-size:15px;outline:none
}
input:focus{border-color:#39ff59}
button{
 width:100%;padding:15px;margin-top:22px;
 background:#39ff59;color:#041006;border:0;
 border-radius:10px;font-weight:bold;font-size:15px
}
button:disabled{opacity:.6}
.bottom{text-align:center;margin-top:22px;font-size:14px;color:#91a991}
a{color:#39ff59;text-decoration:none}
#message{font-size:13px;text-align:center;margin-top:15px;line-height:1.5}
</style>
</head>

<body>
<div class="card">
 <div class="logo">FAILORIA ID</div>
 <div class="symbol">F</div>
 <h1>Создать аккаунт</h1>
 <div class="subtitle">Твой единый аккаунт для проектов Файлории</div>

 <form id="registerForm">
  <label for="username">Имя пользователя</label>
  <input id="username" type="text" minlength="3" maxlength="20"
   placeholder="Например, User123" required>

  <label for="email">Электронная почта</label>
  <input id="email" type="email" placeholder="name@example.com" required>

  <label for="password">Пароль</label>
  <input id="password" type="password" minlength="6"
   placeholder="Минимум 6 символов" required>

  <label for="repeatPassword">Повтори пароль</label>
  <input id="repeatPassword" type="password"
   placeholder="Повтори пароль" required>

  <button id="submitButton" type="submit">Зарегистрироваться</button>
 </form>

 <div id="message"></div>

 <div class="bottom">
  Уже есть аккаунт? <a href="login.html">Войти</a>
 </div>
 <div class="bottom">
  <a href="index.html">На главную</a>
 </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 doc,
 setDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyBkvQ49TJLLTAzLdRXzFMLh_0za8-07cRY",
 authDomain: "filoria-8cf9f.firebaseapp.com",
 projectId: "filoria-8cf9f",
 storageBucket: "filoria-8cf9f.firebasestorage.app",
 messagingSenderId: "974748954017",
 appId: "1:974748954017:web:626fe05cf5a7df5485afe0",
 measurementId: "G-7N8D3GMNZM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("submitButton");

function showMessage(text,color){
 message.textContent = text;
 message.style.color = color;
}

form.addEventListener("submit", async (event)=>{
 event.preventDefault();

 if(button.disabled) return;

 const username = document.getElementById("username").value.trim();
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;
 const repeatPassword = document.getElementById("repeatPassword").value;

 if(username.length < 3 || username.length > 20){
  showMessage("Имя должно содержать от 3 до 20 символов.","#ff7777");
  return;
 }

 if(!/^[a-zA-Zа-яА-ЯёЁ0-9_-]+$/.test(username)){
  showMessage("Используй буквы, цифры, _ или -.","#ff7777");
  return;
 }

 if(password !== repeatPassword){
  showMessage("Пароли не совпадают.","#ff7777");
  return;
 }

 button.disabled = true;
 button.textContent = "Создаём аккаунт...";
 showMessage("Создаём твой Failoria ID...","#91a991");

 try{
  const result = await createUserWithEmailAndPassword(
   auth,email,password
  );

  const user = result.user;

  await updateProfile(user,{
   displayName: username
  });

  showMessage("Аккаунт создан! Сохраняем профиль...","#39ff59");

  try{
   await setDoc(doc(db,"users",user.uid),{
    uid:user.uid,
    username:username,
    email:user.email,
    photoURL:"",
    createdAt:serverTimestamp()
   });
  }catch(profileError){
   console.error("Ошибка сохранения профиля:",profileError);
  }

  showMessage("Добро пожаловать! Переходим в кабинет...","#39ff59");

  window.location.assign(
   new URL("profile.html",window.location.href).href
  );

 }catch(error){
  console.error(error);

  const errors = {
   "auth/email-already-in-use":"Эта почта уже зарегистрирована. Войди в аккаунт.",
   "auth/invalid-email":"Неправильный адрес почты.",
   "auth/weak-password":"Пароль слишком простой.",
   "auth/network-request-failed":"Проверь подключение к интернету.",
   "auth/operation-not-allowed":"В Firebase не включена регистрация по почте."
  };

  showMessage(errors[error.code] || "Ошибка: "+error.message,"#ff7777");

  button.disabled = false;
  button.textContent = "Зарегистрироваться";
 }
});
</script>
</body>
</html>
